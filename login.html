<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal Login | Ideal English Public School</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body{min-height:100vh;background:#f4f6fa;display:grid;place-items:center;padding:24px}
    .login-wrap{width:min(100%,460px);background:#fff;border-radius:18px;padding:32px;box-shadow:0 18px 55px #14274618}
    .login-wrap h1{color:#142746;margin:0 0 8px}.login-wrap p{color:#5d6675;line-height:1.6}
    .login-wrap label{display:block;font-weight:600;margin:16px 0 7px;color:#142746}
    .login-wrap input,.login-wrap select{width:100%;padding:12px;border:1px solid #d7dce5;border-radius:9px;font:inherit}
    .login-wrap button{width:100%;margin-top:20px;padding:13px;background:#142746;color:#fff;border:0;border-radius:9px;font:inherit;font-weight:700;cursor:pointer}
    .message{margin-top:14px;padding:12px;border-radius:8px;background:#f3f5f8;white-space:pre-wrap;overflow-wrap:anywhere}
    .back{display:inline-block;margin-bottom:20px;color:#9b7726}
  </style>
</head>
<body>
  <main class="login-wrap">
    <a class="back" href="index.html">← Back to school website</a>
    <h1>School Portal Login</h1>
    <p>Use the email and password provided by the school office. Accounts are created by the administrator.</p>
    <form id="loginForm">
      <label for="role">I am a</label>
      <select id="role" required>
        <option value="student">Student</option><option value="teacher">Teacher</option><option value="parent">Parent / Guardian</option><option value="admin">Administrator</option>
      </select>
      <label for="email">Email address</label><input id="email" type="email" autocomplete="username" required>
      <label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
      <button id="loginButton" type="submit">Sign in securely</button>
      <div id="message" class="message" role="status" hidden></div>
    </form>
    <p style="font-size:.9rem">Forgot your password? Contact the school administrator for a reset.</p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script><script src="js/login.js"></script>
</body></html>
